name: Build Epopup custom OpenMQTTGateway firmware

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official upstream stable tag. Start with v1.8.1; try newer versions only after reviewing changes.'
        type: string
        required: true
        default: 'v1.8.1'

permissions:
  contents: read

concurrency:
  group: epopup-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Custom ESP32/CC1101 build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out private profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.19'

      - name: Verify custom GPIO and OTA safety configuration
        run: python3 scripts/validate.py

      - name: Build from selected upstream release
        env:
          PIO_BIN: pio
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash scripts/build.sh "$UPSTREAM_TAG"

      - name: Upload firmware (downloadable artifact, NEVER auto-flash)
        uses: actions/upload-artifact@v4
        with:
          name: epopup-firmware-${{ inputs.upstream_tag }}
          path: dist/${{ inputs.upstream_tag }}/
          if-no-files-found: error
          retention-days: 90
