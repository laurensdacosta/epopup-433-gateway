; Epopup 433.96 MHz ESP32 + CC1101 firmware profile.
;
; This file must be copied to the root of OpenMQTTGateway as epopup_env.ini.
; Upstream platformio.ini automatically imports *_env.ini files.
;
; Do not inherit upstream's build_flags: its multi_receiver profile uses
; GDO0=12 by default. Replacing the full flag list avoids silent conflicts.
[env:epopup-433]
extends = env:esp32dev-multi_receiver
build_flags =
  ${com-esp32.build_flags}
  '-DZgatewayRF="RF"'
  '-DZgatewayRF2="RF2"'
  '-DZgatewayRTL_433="RTL_433"'
  '-DZradioCC1101="CC1101"'
  '-DGateway_Name="OMG_multi_receiver"'
  '-DvalueAsATopic=true'
  '-DRF_CC1101="CC1101"'
  '-DRF_MODULE_CS=5'
  '-DRF_MODULE_GDO0=4'
  '-DRF_MODULE_GDO2=27'
  '-DRF_EMITTER_GPIO=4'
  '-DRF_RECEIVER_GPIO=27'
  ; Prevent the gateway from accepting generic GitHub OTA images via MQTT.
  ; Future updates must use a custom-built, checked firmware image.
  '-UMQTT_HTTPS_FW_UPDATE'
